[project]
name = "mesoporous-knowledge-extraction"
version = "0.1.0"
description = "基于大模型智能体的介孔材料文献知识自动抽取系统:给定文献全文,自动抽取结构化实验知识"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.53.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "PyMuPDF>=1.24.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "playwright>=1.62.0",
]
